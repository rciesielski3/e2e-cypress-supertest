name: CI

# On-demand only: the suites hit public third-party sites (dummyjson.com,
# automationexercise.com), so they are run manually rather than on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (Jest + Supertest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:api

  ui:
    name: UI tests (Cypress)
    # Not a required check: depends on the availability of a public third-party site.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Installs dependencies (npm ci) and caches both ~/.npm and the Cypress binary.
      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          command: npm run test:ui:headless -- --config video=true
        env:
          # Optional. When unset, the suite registers (and deletes) a disposable user.
          CYPRESS_USER_EMAIL: ${{ secrets.CYPRESS_USER_EMAIL }}
          CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
